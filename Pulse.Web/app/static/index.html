<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Web | VPU Diagnostics</title>
    <link rel="icon" type="image/png" href="/static/img/pulse-full-transparent.png">
    <link rel="apple-touch-icon" href="/static/img/pulse-full-transparent.png">
    <link rel="stylesheet" href="/static/tailwind-min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Theme detection runs before first paint to avoid flash.
        // Priority: saved preference > system preference > light (default).
        (function() {
            var saved = localStorage.getItem('pulse-theme');
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="h-full bg-pulse-bg text-pulse-text overflow-hidden">
    <!-- Splash screen (system map variant): the rig drawn as its signal
         chain -- cameras, the VPU, the venue network, the Pixellot cloud,
         ScoreConnect and the stream itself. Each node lights up with the
         answer its check produced, links carry traffic while probes run,
         and the findings list below names every issue as it lands.
         Visible until every preload section has settled; re-shown by Run
         All Diagnostics. Filled by the _splash* code in app.js. -->
    <div id="splash" class="splash">
        <div class="splash-frame">
            <header class="splash-head">
                <div class="splash-logo" role="img" aria-label="Pulse"></div>
                <div class="splash-meta">
                    <span class="splash-version" id="splash-version">{{PULSE_VERSION}}</span>
                    <span class="splash-clock" id="splash-clock" aria-hidden="true">0.0s</span>
                </div>
            </header>
            <div class="splash-status" role="status" aria-live="polite">
                <div class="splash-verb"><span id="splash-verb">Loading diagnostics…</span><span class="splash-countdown" id="splash-countdown" aria-hidden="true"></span></div>
                <div class="splash-count" id="splash-count">&nbsp;</div>
            </div>
            <div class="splash-progress" aria-hidden="true">
                <div id="splash-progress-fill" class="splash-progress-fill"></div>
            </div>
            <div class="splash-verdict" id="splash-verdict" role="alert" hidden></div>
            <div class="map-ticker" id="splash-ticker" aria-hidden="true"></div>
            <section class="map" id="splash-map" aria-label="Checks by part of the system">
                <svg class="map-links" id="map-links" aria-hidden="true"></svg>
                <ol class="map-nodes" id="splash-checklist"></ol>
            </section>
            <section class="map-findings" aria-label="Issues found so far">
                <h2 class="splash-pane-title"><span id="map-findings-title">Found so far</span> <span class="splash-pane-count" id="map-findings-count"></span></h2>
                <ul class="map-findings-list" id="map-findings"></ul>
            </section>
            <div class="splash-note" id="splash-note">Running a full diagnostic sweep. This can take a moment.</div>
        </div>
    </div>
    <div id="app" class="flex h-full">
        <nav id="sidebar" class="w-56 bg-pulse-sidebar border-r border-pulse-border flex flex-col flex-shrink-0">
            <div class="sidebar-brand">
                <div class="sidebar-brand-logo" role="img" aria-label="Pulse"></div>
                <p class="sidebar-brand-tagline">VPU Diagnostics</p>
            </div>
            <div id="demo-banner" class="demo-banner hidden">DEMO DATA</div>
            <div class="flex-1 overflow-y-auto py-1" id="nav-links"></div>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark mode"></button>
            <div class="sidebar-powered">
                <span class="powered-by-label">Powered by</span>
                <img class="powered-by-logo" src="/static/img/playon.png" alt="PlayOn" />
            </div>
            <div class="sidebar-footer"></div>
        </nav>
        <main id="content" class="flex-1 overflow-y-auto p-6">
            <div class="max-w-6xl mx-auto" id="page"></div>
        </main>
    </div>
    <!-- LMI auto-close countdown (hidden unless the server is counting
         down to close after the LogMeIn session ended — see app.js
         _updateLmiCountdown). -->
    <div id="lmi-countdown" class="lmi-countdown hidden" role="alert" aria-live="assertive"></div>
    <script src="/static/app.js"></script>
</body>
</html>
