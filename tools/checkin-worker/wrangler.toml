# Two Workers from one codebase, sharing one D1 database:
#   pulse-checkin        public ingest for VPUs + the daily "no check-ins" Slack alert
#   pulse-checkin-admin  read-only views + POST /agent-target, behind Cloudflare Access
# They are split because Access on a workers.dev hostname covers the whole
# hostname, and the VPUs must be able to POST without an Access login.

name = "pulse-checkin"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ROLE = "ingest"
ALERT_WINDOW_HOURS = "24"
ALERT_MIN_CHECKINS = "1"

[[d1_databases]]
binding = "DB"
database_name = "pulse-checkins"
database_id = "30ea63a8-dbec-494c-827b-ddb48e6dbaac"
migrations_dir = "migrations"

[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# 13:00 UTC = 9 AM Eastern in summer, 8 AM in winter.
[triggers]
crons = ["0 13 * * *"]

# Secrets (wrangler secret put): SLACK_WEBHOOK_URL. (CHECKIN_SECRET is no longer
# used; the ingest takes no write key.)

[env.admin]
name = "pulse-checkin-admin"
workers_dev = true

[env.admin.vars]
ROLE = "admin"
# From Zero Trust > Access > Applications > (this app) > Overview.
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
# Comma separated: this app's AUD tag and Pulse Vitals' (it forwards its
# viewer's token over a service binding to POST /agent-target, PV-85).
ACCESS_AUD = "REPLACE_WITH_APPLICATION_AUD_TAG"
# Who may set the agent target (POST /agent-target). Empty: nobody.
FLEET_CONTROL_EDITORS = ""
# Optional secret (wrangler secret put GITHUB_TOKEN --env admin): the release
# check's GitHub API calls, past the unauthenticated rate limit.

[[env.admin.d1_databases]]
binding = "DB"
database_name = "pulse-checkins"
database_id = "30ea63a8-dbec-494c-827b-ddb48e6dbaac"
migrations_dir = "migrations"

[env.admin.triggers]
crons = []
