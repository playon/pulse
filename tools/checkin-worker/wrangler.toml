# Two Workers from one codebase, sharing one D1 database:
#   pulse-checkin        public ingest for VPUs + the daily "no check-ins" Slack alert
#   pulse-checkin-admin  read-only views + POST /agent-target, behind Cloudflare Access
# They are split because Access on a workers.dev hostname covers the whole
# hostname, and the VPUs must be able to POST without an Access login.

name = "pulse-checkin"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ROLE = "ingest"
ALERT_WINDOW_HOURS = "24"
ALERT_MIN_CHECKINS = "1"

[[d1_databases]]
binding = "DB"
database_name = "pulse-checkins"
database_id = "30ea63a8-dbec-494c-827b-ddb48e6dbaac"
migrations_dir = "migrations"

[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# 13:00 UTC = 9 AM Eastern in summer, 8 AM in winter.
[triggers]
crons = ["0 13 * * *"]

# Secrets (wrangler secret put): SLACK_WEBHOOK_URL. (CHECKIN_SECRET is no longer
# used; the ingest takes no write key.)

[env.admin]
name = "pulse-checkin-admin"
workers_dev = true

[env.admin.vars]
ROLE = "admin"
# The Zero Trust team domain (the same team as Pulse Vitals).
ACCESS_TEAM_DOMAIN = "young-shape-07d0.cloudflareaccess.com"
# Comma separated: this app's AUD tag (Zero Trust > Access controls >
# Applications > pulse-checkin-admin - Cloudflare Workers) and Pulse Vitals'
# (it forwards its viewer's token over a service binding to POST /agent-target,
# PV-85). The AUD tag is an identifier, not a secret.
ACCESS_AUD = "f0243adfb73f076a8b35cf56b7ae8b906ff8e822a7f75a32332a2ea77a04797f,f5e7af1459db6633995beaf852967ff2ec3985e8a7f279e468db11c251eab909"
# Secrets, set with `wrangler secret put <NAME> --env admin`, never here (this
# repo is public, and a deploy would overwrite a plain variable of the same name):
#   FLEET_CONTROL_EDITORS  comma-separated emails that may set the agent target
#                          (POST /agent-target). Unset or empty: nobody.
#   GITHUB_TOKEN           the release check's GitHub API calls. Without it
#                          POST /agent-target answers 500 not-configured rather
#                          than fail at random on the shared-IP rate limit.

[[env.admin.d1_databases]]
binding = "DB"
database_name = "pulse-checkins"
database_id = "30ea63a8-dbec-494c-827b-ddb48e6dbaac"
migrations_dir = "migrations"

[env.admin.triggers]
crons = []
