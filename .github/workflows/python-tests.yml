# Run the Pulse.Web Python test suite.
#
# The suite (Pulse.Web/tests/) encodes real invariants -- the demo-data
# contract that catches demo-vs-real drift, the findings shape the dashboard
# renders, and the Event Streaming cloud parsing that caused the v1.1.2
# production hotfix. Nothing ran it. `test_every_referenced_script_has_demo`
# was red from 2026-07-21 (PR #131 added Remove-CanopyLeaf.ps1 without an
# exemption) until 2026-08-07 -- seventeen days, through two releases, because
# a failing assertion nobody executes is just a comment.
#
# Pinned to 3.12 to match the runtime the fleet actually ships: Pulse.Web/run.bat
# bootstraps embedded CPython 3.12.8. Version matters here -- fromisoformat's
# handling of the 7-digit fractional seconds PowerShell's 'o' format emits
# differs between 3.9 and 3.12, so testing on the wrong minor hides or invents
# failures.
#
# The tests themselves use stdlib unittest only, but they `import main` to test
# it, and main.py imports FastAPI at module level -- so the app's runtime deps
# have to be present or every test module fails to import. Installed from
# Pulse.Web/app/requirements.txt, the same file run.bat installs on a VPU, so CI
# and the fleet cannot drift apart.

name: Python tests

on:
  push:
    branches: [dev, beta, main]
    paths:
      - "Pulse.Web/app/**.py"
      - "Pulse.Web/tests/**.py"
      - "Pulse.Web/app/requirements.txt"
      # test_status_vocabulary.py parses these two directly -- it checks that
      # the status words the collectors EMIT match the cases app.js renders.
      # Without them the test cannot fire on the changes that break it: a
      # collector adding a level string, or app.js dropping a badge case.
      - "Pulse.Web/app/static/app.js"
      - "Pulse.Web/scripts/**.ps1"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "Pulse.Web/app/**.py"
      - "Pulse.Web/tests/**.py"
      - "Pulse.Web/app/requirements.txt"
      # test_status_vocabulary.py parses these two directly -- it checks that
      # the status words the collectors EMIT match the cases app.js renders.
      # Without them the test cannot fire on the changes that break it: a
      # collector adding a level string, or app.js dropping a badge case.
      - "Pulse.Web/app/static/app.js"
      - "Pulse.Web/scripts/**.ps1"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Pulse.Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Pulse.Web/app/requirements.txt

      - name: Install app dependencies
        working-directory: Pulse.Web
        run: python -m pip install --quiet -r app/requirements.txt

      - name: Run unittest suite
        working-directory: Pulse.Web
        run: python -m unittest discover -s tests -v
